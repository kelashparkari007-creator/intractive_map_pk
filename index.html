<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistan Interactive Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pakistan Interactive Map</h1>

    <div class="container">

        <div class="map">
            <object id="pakistanMap" data="pk.svg" type="image/svg+xml"></object>
        </div>

        <div class="info">
            <h2 id="provinceName">Pakistan</h2>
            <img id="provinceImage" src="images/pakistan.jpg" alt="Pakistan">
            <hr>
            <p id="capital"><strong>🏛 Capital:</strong> Select a province</p>
            <p id="population"><strong>👥 Population:</strong></p>
            <p id="area"><strong>📏 Area:</strong></p>
            <p id="language"><strong>🗣 Language:</strong></p>
            <p id="districts"><strong>🗺 Districts:</strong></p>
            <p id="famousCity"><strong>🏙 Famous City:</strong></p>
            <p id="famousPlace"><strong>📍 Famous Place:</strong></p>
            <p id="river"><strong>🌊 Main River:</strong></p>
            <hr>
            <h3>📚 General Knowledge</h3>
            <ul id="gk">
                <li>Click any province on the map.</li>
            </ul>
        </div>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
